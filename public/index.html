    const box = $('#ans-' + an.dataset.answer);
    const txt = (box && box.value || '').trim();
    if (!txt) { toast('先寫一句話再送出'); if (box) box.focus(); return; }
    return void post('/api/answer', { id: an.dataset.answer, text: txt });
  }
  const ad = e.target.closest('[data-adopt]');
  if (ad) return void post('/api/assetDecide', { id: ad.dataset.adopt, ok: true });
  const rd = e.target.closest('[data-redo]');
  if (rd) {
    if (S.busy) return toast('等目前這一步跑完');
    const box = document.getElementById('fb-' + rd.dataset.redo);
    const fb = box ? box.value.trim() : '';
    if (!fb && !confirm('沒有寫修改意見，直接重做一版嗎？寫下哪裡不滿意，重做的成功率會高很多。')) return;
    return void post('/api/assetDecide', { id: rd.dataset.redo, ok: false, feedback: fb });
  }
});

/* ---------- 工作資料夾 ---------- */
let WSINFO = null, PK_PATH = '';

function paintWs() {
  if (!WSINFO) return;
  const root = WSINFO.workspaceRoot || {};
  const project = WSINFO.activeProject || WSINFO;
  $('#wsRootName').textContent = root.name || root.display || '未設定';
  $('#wsRootName').title = root.display || '';
  $('#wsName').textContent = project.name || project.display || '未設定';
  $('#wsName').title = project.display || '';
  $('#wsGit').hidden = !WSINFO.isGit;
  const r = $('#recent');
  r.innerHTML = (WSINFO.recent || []).length
      ? WSINFO.recent.map(x => `<button class="rc" data-rc="${esc(x.path)}" title="${esc(x.display)}">${esc(x.name)}</button>`).join('')
    : '<span class="composehint">還沒有紀錄</span>';
}

async function loadDirs(p) {
  const r = await (await apiFetch('/api/browse?path=' + encodeURIComponent(p || ''))).json();
  if (r.error) return toast(r.error, 4000);
  PK_PATH = r.path;
  $('#pkCur').textContent = r.display;
  $('#pkUp').disabled = !r.parent;
  $('#pkPath').value = r.display;
  $('#dirs').innerHTML = r.entries.length
    ? r.entries.map(e => `<div class="dir ${e.isProject ? 'proj' : ''}">
        <span class="ic">${e.isProject ? '◆' : '▸'}</span>
        <button class="nm2" type="button" data-open="${esc(e.path)}">${esc(e.name)}</button>
        <span class="meta">${e.files} 項</span>
        <button class="pick" data-use="${esc(e.path)}">選這個</button>
      </div>`).join('')
    : '<div class="empty">這裡面沒有子資料夾</div>';
}

async function useWs(p) {
  const r = await post('/api/setWorkspace', { path: p });
  if (!r.ok) return toast(r.msg || '無法使用這個資料夾', 4500);
  WSINFO = r.ws; paintWs();
  $('#picker').hidden = true;
  toast('目前處理專案已切換到「' + r.ws.name + '」');
}

document.addEventListener('click', async e => {
  if (e.target.closest('#wsSwitch')) {
    if (S && S.busy) return toast('等目前這一步跑完再切換');
    if (S && S.goal && !confirm('會議進行中。切換後只會改變目前優先處理的專案，Projects 讀取根目錄與會議紀錄都會保留。要切換嗎？')) return;
    $('#picker').hidden = false;
    await loadDirs(WSINFO ? WSINFO.path : '');
    return;
  }
  if (e.target.closest('#pkClose') || e.target.id === 'picker') { $('#picker').hidden = true; return; }
  if (e.target.closest('#pkUp')) { const r = await (await apiFetch('/api/browse?path=' + encodeURIComponent(PK_PATH))).json(); if (r.parent) loadDirs(r.parent); return; }
  const op = e.target.closest('[data-open]'); if (op) return void loadDirs(op.dataset.open);
  const us = e.target.closest('[data-use]'); if (us) return void useWs(us.dataset.use);
  const rc = e.target.closest('[data-rc]'); if (rc) return void useWs(rc.dataset.rc);
  if (e.target.closest('#pkUse')) return void useWs($('#pkPath').value.trim());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#picker').hidden) $('#picker').hidden = true;
  if (e.target && e.target.id === 'pkPath' && e.key === 'Enter') { e.preventDefault(); useWs(e.target.value.trim()); }
});

/* 從 Finder 拖資料夾進來 —— macOS 會附帶 file:// 路徑 */
const drop = () => $('#drop');
['dragenter','dragover'].forEach(k => document.addEventListener(k, e => {
  if ($('#picker').hidden) return;
  e.preventDefault(); drop().classList.add('hot');
}));
['dragleave','drop'].forEach(k => document.addEventListener(k, e => {
  if ($('#picker').hidden) return;
  if (k === 'dragleave' && e.relatedTarget) return;
  drop().classList.remove('hot');
}));
document.addEventListener('drop', async e => {
  if ($('#picker').hidden) return;
  e.preventDefault();
  let p = '';
  const uri = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (uri) {
    const first = uri.split(/\r?\n/).find(l => l && !l.startsWith('#')) || '';
    p = first.startsWith('file://') ? decodeURIComponent(first.replace('file://','')).replace(/\/$/,'') : first.trim();
  }
  if (!p) return toast('抓不到路徑。請改用下面的清單點選，或直接貼路徑。', 5000);
  $('#pkPath').value = p;
  useWs(p);
});

/* ---------- 提示音：AI 做完一輪就叫你一聲 ---------- */
/* 為什麼要有這個：使用者常常切到 Illustrator 做設計，不會盯著這個畫面。
   AI 一輪動輒十幾二十分鐘，沒有聲音只能一直切回來看。 */
const SFX_URL = '/assets/sfx/yes-my-lord.mp3';
const sfx = new Audio(SFX_URL);
sfx.preload = 'auto';

let sfxOn = false;          // 使用者的開關（記在 localStorage）
let sfxReady = false;       // 瀏覽器是否已經允許這一頁發出聲音
let sfxLast = {};           // 每一種事件各自的節流時間
let prevSnap = null;        // 上一輪的狀態，用來比對「有沒有真的變化」

try { sfxOn = localStorage.getItem('sfxOn') !== '0'; } catch (e) { sfxOn = true; }

const BASE_TITLE = document.title;
let flashTimer = null;

// 分頁在背景時，用標題閃動當第二層提醒（聲音被擋掉時這是唯一的補救）
function flashTitle(msg) {
  clearInterval(flashTimer);
  let on = true, n = 0;
  flashTimer = setInterval(() => {
    if (document.hasFocus()) { clearInterval(flashTimer); document.title = BASE_TITLE; return; }
    // 閃一分鐘後改成靜止的標記：你去 Illustrator 待十分鐘再回來，
    // 標題上還是看得到「剛剛叫過你」，不會什麼痕跡都沒有。
    if (++n > 85) { clearInterval(flashTimer); document.title = '● ' + msg; return; }
    document.title = (on ? '● ' : '　') + msg;
    on = !on;
  }, 700);
}
window.addEventListener('focus', () => { clearInterval(flashTimer); document.title = BASE_TITLE; });

function desktopNotify(msg) {
  try {
    if (window.Notification && Notification.permission === 'granted') {
      new Notification('三方開發會議室', { body: msg, icon: '/assets/avatar-claude.png', tag: 'aimr' });
    }
  } catch (e) {}
}

function paintSfx() {
  const b = $('#sfxBtn');
  if (!b) return;
  b.setAttribute('aria-pressed', sfxOn ? 'true' : 'false');
  const blocked = sfxOn && !sfxReady;
  b.classList.toggle('locked', blocked);
  b.textContent = !sfxOn ? '提示音 關' : (blocked ? '提示音 點一下啟用' : '提示音 開');
  b.title = !sfxOn ? '目前不會出聲，按一下可以打開'
    : blocked ? '瀏覽器規定：你要先在這一頁點一下，網站才能發出聲音。按這顆就會啟用並試聽一次。'
    : 'AI 做完一輪、或有事情要你決定時，會出一聲提示';
}

// 同一類事件在冷卻時間內只響一次，避免一輪裡狀態更新好幾次就叫好幾聲
function nudge(kind, msg, cooldown) {
  const now = Date.now();
  if (now - (sfxLast[kind] || 0) < (cooldown || 6000)) return;
  sfxLast[kind] = now;
  if (document.hidden) { flashTitle(msg); desktopNotify(msg); }
  if (!sfxOn) return;
  try {
    sfx.currentTime = 0;
    const pr = sfx.play();
    if (pr && pr.catch) pr.then(() => { if (!sfxReady) { sfxReady = true; paintSfx(); } })
                          .catch(() => { if (sfxReady) { sfxReady = false; } paintSfx(); flashTitle(msg); });
  } catch (e) { paintSfx(); }
}

function snapshot(s) {
  // 用 id 而不是數量：一邊核准掉一件、一邊又進來一件時，
  // 數量一來一往沒變，只比數量的話那一聲就漏掉了。
  const open = [
    ...(s.actions || []).filter(a => needsYou(a, 'act')).map(a => 'a' + a.id),
    ...(s.deliverables || []).filter(d => needsYou(d, 'deliver')).map(d => 'd' + d.id),
  ];
  return {
    busy: !!s.busy,
    open,
    review: (s.deliverables || []).filter(d => d.status === 'review').map(d => d.id),
  };
}

// render() 每次跑完都會叫這裡，比對出「值得叫你一聲」的三種時刻
function checkAlerts() {
  if (!S) return;
  const now = snapshot(S);
  const was = prevSnap;
  prevSnap = now;
  if (!was) return;                       // 第一次載入不叫
  const isNew = (a, b) => a.some(x => !b.includes(x));
  if (isNew(now.review, was.review)) return nudge('review', '素材做好了，等你看一下');
  if (isNew(now.open, was.open))     return nudge('open',   '有事情需要你決定');
  if (was.busy && !now.busy)         return nudge('done',   'AI 跑完一輪了');
}

// 瀏覽器規定網站要先被使用者互動過才能發聲。
// 使用者在這一頁點任何地方時，偷偷用靜音播一次來解鎖。
let sfxUnlocking = false;
function askNotifyPermission() {
  try {
    if (window.Notification && Notification.permission === 'default') {
      Notification.requestPermission().then(paintSfx);
    }
  } catch (e) {}
}
document.addEventListener('click', () => {
  // 通知權限一定要在這裡問。原本綁在音效開關裡，但開關預設就是開的，
  // 使用者根本不會去按它，於是「聲音被擋就發系統通知」那條備案永遠是空的。
  askNotifyPermission();
  if (sfxReady || !sfxOn || sfxUnlocking) return;
  sfxUnlocking = true;
  const v = sfx.volume;
  sfx.volume = 0;
  const pr = sfx.play();
  const restore = () => { sfx.volume = v; sfxUnlocking = false; };
  if (pr && pr.then) pr.then(() => { sfx.pause(); sfx.currentTime = 0; restore(); sfxReady = true; paintSfx(); })
                       .catch(restore);
  else restore();
}, true);

$('#sfxBtn').addEventListener('click', () => {
  sfxOn = !sfxOn;
  try { localStorage.setItem('sfxOn', sfxOn ? '1' : '0'); } catch (e) {}
  if (sfxOn) {
    // 這一下是使用者的點擊，正好可以拿來解鎖＋試聽
    sfx.currentTime = 0;
    const pr = sfx.play();
    if (pr && pr.then) pr.then(() => { sfxReady = true; paintSfx(); }).catch(() => { sfxReady = false; paintSfx(); });
    askNotifyPermission();
  }
  paintSfx();
});
paintSfx();

/* ---------- SSE ---------- */
eventStream = new EventSource('/api/events');
eventStream.onmessage = m => {
  const d = JSON.parse(m.data);
  if (d.type === 'state') { S = d.state; render(); }
  if (d.type === 'error') { showErrorBanner(d.error); }
  if (d.type === 'workspace') { WSINFO = d.ws; paintWs(); }
  if (d.type === 'modelConfig') { applyModelConfig(d); paintModelControls(); }
  if (d.type === 'modelTiers') {
    // 舊版「算力檔位」資料：它的 current 是檔位名稱（standard…），不能蓋掉真正的模型設定。
    // 以前就是被它蓋掉，選單才會一直顯示清單第一個模型，和實際設定對不起來。
    MODEL_INFO = { ...MODEL_INFO, tiers: d.tiers || MODEL_INFO.tiers, tierCurrent: d.current || MODEL_INFO.tierCurrent };
    paintModelControls();
  }
  if (d.type === 'saved') { const h = $('#hint'); h.textContent = h.textContent.replace(/ · 已存檔.*$/, '') + ' · 已存檔 ' + d.at; }
  if (d.type === 'log') { $('#busyLog').textContent = d.log.slice(-160).replace(/\s+/g, ' '); }
};
let authProbePending = false;
eventStream.onerror = async () => {
  $('#liveTxt').textContent = '連線中斷 — 伺服器可能已關閉';
  if (authProbePending || redirectingToLogin) return;
  authProbePending = true;
  try {
    const response = await fetch('/api/state', { cache: 'no-store' });
    if (response.status === 401) goToLogin();
  } catch {}
  finally { authProbePending = false; }
};
</script>
</body>
